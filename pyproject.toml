[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-skill-router"
version = "0.1.0"
description = "Fast, cheap AI agent skill routing using TypeSafe's Jev decision model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Savio Shaji", email = "savioshajioff@gmail.com" }]
keywords = ["ai", "agents", "routing", "typesafe", "jev", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typesafe-sdk>=0.7.2",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "anthropic>=0.30",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jev-skill-router = "jev_skill_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_skill_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
